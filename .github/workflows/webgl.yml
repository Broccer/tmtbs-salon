name: WebGL derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Disk alanı aç (Unity imajı büyük)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      # Çok dilli yazı tipi (Çince/Japonca/Korece/Arapça/Hintçe/Bengalce): Google Fonts'tan (OFL) alınıp
      # tek TTF'de birleşir. Adım başarısız olursa oyun Unity'nin yerleşik yazı tipine döner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Yazı tipini hazırla
        continue-on-error: true
        run: |
          pip install fonttools==4.55.3 brotli
          mkdir -p Assets/Resources/Fonts
          python tools/fonts/build_font.py Assets/Resources/Fonts/TmtbsSans.ttf

      - name: Unity WebGL derle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: WebGLBuild.Build
          buildsPath: build
          allowDirtyBuild: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
