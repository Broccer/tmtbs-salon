<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; overflow: hidden; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0b1220; outline: none; }
    #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffd54a; font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b1220; gap: 14px; }
    #load .t { font-size: 26px; letter-spacing: 1px; }
    #bar { width: min(70vw, 360px); height: 8px; background: #1d2840; border-radius: 4px; overflow: hidden; }
    #fill { height: 100%; width: 0; background: linear-gradient(90deg, #0fa8ad, #ffd54a); }
    #load .s { color: #9aa6bf; font-size: 13px; font-weight: 400; text-align: center; padding: 0 20px; }
    #rot { display: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="load">
    <div class="t">TRADE OF MTBS</div>
    <div>Seans Salonu yükleniyor… <span id="pct">0%</span></div>
    <div id="bar"><div id="fill"></div></div>
    <div class="s">İlk açılış biraz sürebilir. Telefonda yatay tutman önerilir.</div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    var canvas = document.querySelector("#unity-canvas");
    // Sayfa kaydırması/yakınlaştırması oyunu bozmasın
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); });
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        var v = Math.round(p * 100);
        document.getElementById("pct").textContent = v + "%";
        document.getElementById("fill").style.width = v + "%";
      }).then(function (u) {
        window.unityInstance = u;
        var l = document.getElementById("load");
        if (l) l.remove();
      }).catch(function (m) {
        document.querySelector("#load .s").textContent = "Açılamadı: " + m;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
